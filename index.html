<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>amitraaj.in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Cormorant Garamond provides a high-end, editorial elegance; Montserrat offers clean, modern contrast -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Montserrat:wght@300&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0 20px; /* Prevents text from touching screen edges on small devices */
            background-color: #2b2b2b;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            overflow: hidden;
            /* Leverages native rendering engines on iOS and Android for maximum crispness */
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .domain {
            font-family: 'Cormorant Garamond', serif;
            /* Fluid typography: Automatically scales between 2rem (mobile) and 6rem (desktop) */
            font-size: clamp(2rem, 8vw, 6rem);
            font-weight: 500;
            letter-spacing: -0.02em;
            margin: 0 0 15px 0;
            line-height: 1;
        }

        .status {
            /* Fallbacks to native iOS (-apple-system) and Android (Roboto) sans-serifs if needed */
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            /* Fluid typography: Automatically scales between 0.7rem and 1rem */
            font-size: clamp(0.7rem, 2.5vw, 1rem);
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 0.6em; /* Wide tracking for a premium, established feel */
            margin-right: -0.6em; /* Mathematically offsets the trailing letter spacing for perfect center alignment */
            opacity: 0.65;
        }
    </style>
</head>
<body>
    <div class="domain">amitraaj.in</div>
    <div class="status">coming soon</div>
</body>
</html>
